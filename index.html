<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <title>155 UASU BAF | Office Management System</title>
    <meta name="description" content="Military personnel duty register, parade state tracker, TDY register, and monthly roster management system for 155 UASU BAF BASE ZHR." />
    <meta property="og:title" content="155 UASU BAF | Office Management System" />
    <meta property="og:description" content="Military personnel duty register, parade state tracker, TDY register, and monthly roster management system for 155 UASU BAF BASE ZHR." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&family=Noto+Serif+Bengali:wght@400;500;600;700;800;900&family=Tiro+Bangla:ital@0;1&display=swap" rel="stylesheet" crossorigin="anonymous">
    <link rel="icon" type="image/png" sizes="192x192" href="/pwa-192x192.png?v=10" />
    <link rel="icon" type="image/png" sizes="512x512" href="/pwa-512x512.png?v=10" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png?v=10" />
    <link rel="manifest" href="/manifest.json?v=10" />
    <style>
      /* Hide scrollbars across all browsers, Android WebView, and APK */
      *, *::before, *::after, html, body, #root {
        scrollbar-width: none !important;
        -ms-overflow-style: none !important;
      }
      ::-webkit-scrollbar,
      *::-webkit-scrollbar,
      html::-webkit-scrollbar,
      body::-webkit-scrollbar,
      #root::-webkit-scrollbar {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
        -webkit-appearance: none !important;
        opacity: 0 !important;
        visibility: hidden !important;
      }
      ::-webkit-scrollbar-thumb,
      *::-webkit-scrollbar-thumb,
      html::-webkit-scrollbar-thumb,
      body::-webkit-scrollbar-thumb {
        display: none !important;
        width: 0px !important;
        height: 0px !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-track,
      *::-webkit-scrollbar-track {
        display: none !important;
        background: transparent !important;
      }
      ::-webkit-scrollbar-corner,
      *::-webkit-scrollbar-corner {
        display: none !important;
        background: transparent !important;
      }
    </style>
    <meta name="theme-color" content="#020617" />
    <style>
      html, body {
        background-color: #020617 !important;
        color: #f8fafc !important;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      @keyframes baf_pulse_anim {
        0% { left: -50%; width: 50%; }
        50% { left: 25%; width: 60%; }
        100% { left: 100%; width: 50%; }
      }
    </style>
  </head>
  <body style="background-color: #020617; color: #f8fafc; margin: 0; min-height: 100vh;">
    <script>
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.getRegistrations().then(function(regs) {
          for (let r of regs) r.unregister();
        });
      }
    </script>
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #020617; color: #f8fafc; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
        <div style="display: flex; flex-direction: column; align-items: center; gap: 16px;">
          <div style="width: 72px; height: 72px; border-radius: 9999px; background: rgba(16, 185, 129, 0.1); border: 1px solid rgba(16, 185, 129, 0.3); display: flex; align-items: center; justify-content: center; box-shadow: 0 10px 25px -5px rgba(16, 185, 129, 0.2);">
            <img src="/155-uasu-baf-logo.png" alt="155 UASU BAF" style="width: 52px; height: 52px; object-fit: contain;" onerror="this.style.display='none'" />
          </div>
          <div style="text-align: center;">
            <div style="font-size: 11px; font-weight: 800; letter-spacing: 0.15em; color: #34d399; text-transform: uppercase;">155 UASU BAF</div>
            <div style="font-size: 18px; font-weight: 900; color: #ffffff; letter-spacing: -0.02em; margin-top: 2px;">Loading Portal...</div>
          </div>
          <div style="width: 130px; height: 3px; background-color: #1e293b; border-radius: 9999px; overflow: hidden; position: relative;">
            <div style="position: absolute; top: 0; left: 0; height: 100%; width: 50%; background: linear-gradient(90deg, #10b981, #06b6d4); border-radius: 9999px; animation: baf_pulse_anim 1.2s ease-in-out infinite;"></div>
          </div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
